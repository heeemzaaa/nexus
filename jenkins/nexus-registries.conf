# Podman registry config for the local Nexus Docker repositories.
# Install on the host that runs the Podman socket used by Jenkins:
#   ./scripts/setup_nexus_registries.sh
#
# Nexus serves its Docker connectors over plain HTTP; Podman defaults to HTTPS
# for every registry (even localhost), so these entries allow HTTP for these
# two addresses only.
#
# Jenkins' docker CLI talks to the host Podman service through the mounted
# socket, so the push/pull is performed by the host: use "localhost", not the
# "nexus" container name (that name only resolves inside the ci-net network).

# docker-hosted: push
[[registry]]
location = "localhost:8082"
insecure = true

# docker-group: pull (hosted + Docker Hub proxy)
[[registry]]
location = "localhost:8083"
insecure = true
